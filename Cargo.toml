[package]
name = "rust-engine-sim"
version = "0.1.0"
edition = "2021"
description = "Zero-dimensional thermodynamic engine simulator with real-time audio synthesis"
license = "MIT"

[dependencies]
anyhow = "1.0"
cpal = "0.15"
rtrb = "0.3"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# For `pthread_setschedparam` on the simulation thread. The standard library
# has no thread-priority API, and the elevation is a request the simulator is
# written to run without — see `request_realtime_priority` in `src/main.rs`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The DSP/solver hot paths are unusable at opt-level 0; keep dev builds fast enough
# to run the audio stream without underruns.
[profile.dev]
opt-level = 1
